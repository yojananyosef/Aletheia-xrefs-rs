    <style>

      .original-fallback { margin: 2px 0 4px; color: var(--faint); font-size: 8.5px; }
      .original-ref {
        display: block;
        margin-bottom: 3px;
        color: var(--faint);

        letter-spacing: 0.1em;

      .original-words {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 1px 0;
        margin: 0 -4px;
        font-family: "Noto Serif Hebrew", "DejaVu Serif", "Times New Roman", serif;

      .word {

      .word[data-selected="true"] {

      }
      .lex-card {
        margin-top: 14px;
        padding: 12px 13px;

        padding-top: 8px;

        font-family: var(--font-serif);

      .lex-occurrences {
        height: 27px;

      .lex-occurrences-title {

      .reader {

      .chapter-head {

        display: inline-flex;

        gap: 7px;

      .chapter-nav { float: right; display: flex; gap: 4px; margin-top: 3px; }

        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);

        line-height: 1;

      .chapter-nav button:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
      .threads-directions {
        display: inline-flex;
        gap: 2px;
        margin-top: 11px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.022);
      }
      .threads-directions button {
        height: 24px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        cursor: pointer;
      }
      .threads-directions button:hover { color: var(--text); }
      .threads-directions button.active {
        background: var(--surface-3);
        color: var(--text);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset;
      }
      .verse {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 0 -7px 5px;
        padding: 5px 7px;
        border-radius: 6px;
        color: var(--text-soft);
        font-family: var(--font-serif);
        font-size: 15px;
        line-height: 1.68;
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      .verse:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
      .verse-text { flex: 1 1 auto; }

        flex: 0 0 auto;

        border: 1px solid var(--line);
        border-radius: 99px;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1.5;
      }
      .verse-num {
        margin-right: 6px;
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 9px;
        vertical-align: super;
      }

      /* ---------- status, toast, footer ---------- */
      .status {
        position: absolute;
        left: 16px;
        bottom: 10px;
        z-index: 4;
        max-width: 70%;
        color: var(--muted);
        font-size: 10px;
        pointer-events: none;
      }
      .status:empty { display: none; }
      .status.error { color: var(--danger); }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 46px;
        z-index: 50;
        transform: translateX(-50%);
        padding: 9px 15px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: rgba(30, 34, 41, 0.96);
        box-shadow: var(--shadow);
        color: var(--text);
        font-size: 12px;
        white-space: nowrap;
        animation: toast-in 160ms ease-out;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translate(-50%, 6px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

      footer {
        flex: 0 0 30px;
        display: flex;
        align-items: center;
        gap: 4px;

      footer a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }

      .noscript {
        max-width: 640px;
        margin: 12vh auto;
        padding: 0 24px;
        color: var(--text-soft);
        font-family: var(--font-serif);
      }
      .noscript h1 { color: var(--text); font-size: 32px; }

      /* ---------- responsive ---------- */
      @media (max-width: 1180px) {
        .legend { display: none; }
        .hints { display: none; }
        .stats { max-width: calc(100% - 28px); }
      }
      @media (max-width: 980px) {
        .topbar { gap: 8px; padding: 0 12px; }
        .views { margin-left: 0; }
        .panel {
          position: absolute;
          top: 12px;
          right: 12px;
          bottom: 12px;
          z-index: 10;
          width: min(400px, calc(100% - 24px));
          max-height: none;
          box-shadow: var(--shadow);
        }
        #threads-panel { top: 12px; right: 12px; bottom: 12px; }
      }
      @media (max-width: 860px) {
        .views { display: none; }

      }
      @media (max-width: 760px) {
        body { overflow: hidden; }
        .topbar {
          flex: 0 0 auto;

          flex-wrap: wrap;

          padding: 9px 12px;

          right: 8px;
          left: 8px;

        }
        .chapter-head { margin: -18px -18px 16px; padding: 14px 18px 9px; }

        .verse { font-size: 14px; }

        .toast { bottom: 18px; max-width: calc(100% - 32px); white-space: normal; text-align: center; }
      }
      @media (max-width: 560px) {
        .brand-text { display: none; }
        .topbar h1 { display: none; }
        .translation { max-width: 98px; }
        .lang-select { width: 58px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

  </head>
