<!doctype html>
<html lang="es">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Referencias cruzadas de la Biblia: 31.102 versículos y 344.799 referencias, con la Biblia Platense y la ASV en una vista de arcos portada a Rust + WebAssembly."
    />
    <title>Referencias cruzadas de la Biblia · Rust</title>
    <link data-trunk rel="rust" data-bin="bible-app" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="data" />
    <link data-trunk rel="copy-dir" href="threads" />
    <style>
      :root {
        --bg: #0d0d0d;
        --panel: #121212;
        --line: #262626;
        --text: #ecebe6;
        --muted: #9a9890;
        --accent: #eb568f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .app { height: 100vh; display: flex; flex-direction: column; }

      .topbar {
        height: 56px;
        flex: 0 0 56px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
      }
      .topbar h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        white-space: nowrap;
      }
      .views { display: flex; gap: 4px; margin-left: 8px; }
      .view {
        display: inline-flex;
        align-items: center;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        text-decoration: none;
      }
      .view.active { color: var(--text); background: #1c1c1c; border-color: var(--line); }
      .search { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
      .search input {
        width: min(100%, 520px);
        height: 36px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #151515;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        padding: 0 12px;
        outline: none;
      }
      .search input:focus { border-color: #454545; background: #191919; }
      .translation {
        height: 34px;
        padding: 0 8px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #151515;
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      .filters-toggle {
        height: 34px;
        padding: 0 14px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #151515;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .filters-toggle:hover { background: #1c1c1c; }

      .arcs-root { position: relative; flex: 1 1 auto; display: flex; min-height: 0; }
      .arcs-root[hidden] { display: none; }

      .threads-root {
        position: relative;
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
        margin: 0 12px;
        border: 1px solid #1e1e1e;
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg);
      }
      .threads-root[hidden] { display: none; }
      .reader {
        width: min(44%, 540px);
        min-width: 260px;
        overflow-y: auto;
        padding: 20px 22px 64px;
        border-right: 1px solid #1c1c1c;
        scrollbar-width: thin;
        scrollbar-color: #333 transparent;
      }
      .chapter-head {
        position: sticky;
        top: 0;
        z-index: 1;
        margin: 0 -22px 18px;
        padding: 14px 22px 10px;
        background: rgba(13, 13, 13, 0.94);
        border-bottom: 1px solid #1c1c1c;
        backdrop-filter: blur(4px);
      }
      .chapter-kicker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      .chapter-kicker i { width: 14px; height: 3px; border-radius: 2px; }
      .chapter-head h2 {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: block;
      }
      .chapter-nav { float: right; display: flex; gap: 4px; margin-top: 2px; }

        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #161616;
        color: var(--text);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;

        margin: 0 0 11px;
        font-size: 14px;
        line-height: 1.62;
        color: #c9c6bf;
        cursor: pointer;
        border-radius: 5px;
        padding: 1px 3px;
        margin-left: -3px;
      }
      .verse-text { flex: 1 1 auto; }
      .verse-count {
        flex: 0 0 auto;
        color: #6f6d66;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .threads-directions {
        display: flex;
        gap: 4px;
        margin-top: 10px;
      }
      .threads-directions button {
        height: 26px;
        padding: 0 9px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .threads-directions button.active {
        background: #1e1e1e;
        border-color: #3a3a3a;
        color: var(--text);
      }
      .verse:hover { color: #fff; background: #171717; }
      .verse-num {
        color: #77756e;
        font-size: 10px;
        margin-right: 6px;
        vertical-align: super;
      }
      .verse-empty { color: #625f58; font-style: italic; font-size: 12px; }
      .threads-stage { position: relative; flex: 1 1 auto; min-width: 0; }
      #threads-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #threads-panel { z-index: 4; }

      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 320px;
        margin: 0 12px;
        border: 1px solid #1e1e1e;
        border-radius: 10px;
        background: var(--bg);
        overflow: hidden;
        touch-action: none;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #arcs { z-index: 1; }
      #axis { z-index: 2; pointer-events: none; }

      .legend {
        position: absolute;
        z-index: 3;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 22px;
        padding: 10px 14px;
        background: rgba(13, 13, 13, 0.82);
        border: 1px solid #202020;
        border-radius: 8px;
        font-size: 12px;
        pointer-events: none;
      }
      .legend-column { display: flex; flex-direction: column; gap: 4px; }
      .legend-title {
        font-size: 9px;
        letter-spacing: 0.09em;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .legend-item { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
      .legend-item i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

      .stats {
        position: absolute;
        z-index: 3;
        top: 12px;
        right: 14px;
        text-align: right;
        font-size: 12px;
        color: #cfcdc6;
        line-height: 1.55;
        pointer-events: none;
      }
      .stats strong { color: #fff; font-weight: 600; }
      .hints {
        position: absolute;
        z-index: 3;
        top: 56px;
        right: 14px;
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
      }

      .tooltip {
        position: absolute;
        z-index: 5;
        padding: 6px 9px;
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 7px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      }
      .tooltip span { color: var(--muted); font-size: 11px; }

      .filters {
        position: absolute;
        top: 12px;
        right: 14px;
        z-index: 6;
        width: 290px;
        padding: 14px;
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      .filters-row { display: flex; gap: 6px; align-items: baseline; font-size: 12px; color: #d6d4cd; }
      .filters output { color: #fff; font-weight: 600; }
      .filters input[type="range"] { width: 100%; margin: 12px 0 4px; accent-color: var(--accent); }
      .filters-note { margin: 6px 0 0; color: var(--muted); font-size: 11px; }

      .panel {
        position: relative;
        flex: 0 0 min(390px, 92vw);
        z-index: 4;
        width: min(390px, 92vw);
        height: 100%;
        background: rgba(15, 15, 15, 0.97);
        border-left: 1px solid #242424;
        overflow-y: auto;
        padding: 16px 18px 32px;
        backdrop-filter: blur(6px);
      }
      .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .panel-kicker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      .panel-kicker i { width: 14px; height: 3px; border-radius: 2px; }
      .panel h2 { margin: 6px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .panel-close {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #161616;
        color: var(--text);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .panel-verse { margin: 12px 0 0; font-size: 14px; line-height: 1.55; color: #dcdad3; }
      .panel-verse-ref { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
      .panel-section { margin-top: 22px; }
      .panel-section h3 {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .panel-section h3 span { color: #fff; margin-left: 4px; }
      .panel-note { margin: 3px 0 10px; font-size: 11px; color: #77756e; }
      .panel-item { padding: 9px 0; border-top: 1px solid #1e1e1e; }
      .panel-item-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
      .panel-item-ref { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #f0eee8; }
      .panel-item-ref i { width: 12px; height: 3px; border-radius: 2px; }
      .panel-item-votes { font-size: 11px; color: var(--muted); white-space: nowrap; }
      .panel-item p { margin: 5px 0 0; font-size: 12px; line-height: 1.5; color: #b9b6ae; }
      .panel-empty { font-size: 12px; color: #77756e; margin: 8px 0 0; }

      .status {
        position: absolute;
        left: 14px;
        bottom: 10px;
        font-size: 12px;
        color: var(--muted);
        pointer-events: none;
        max-width: 70%;
      }
      .status:empty { display: none; }
      .status.error { color: #ff8a8a; }

      footer {
        flex: 0 0 28px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 16px;
        font-size: 11px;
        color: #77756e;
        white-space: nowrap;
        overflow: hidden;
      }
      footer a { color: #9c9a93; text-decoration: none; }
      footer a:hover { color: #cfcdc6; }

      @media (max-width: 760px) {
        .topbar { gap: 8px; padding: 0 10px; }
        .topbar h1 { font-size: 14px; }
        .views { display: none; }
        .legend { display: none; }
        .hints { display: none; }
        .stats { top: 8px; right: 10px; font-size: 10px; }
        .arcs-root { position: relative; flex: 1 1 auto; display: flex; min-height: 0; }
      .arcs-root[hidden] { display: none; }

      .threads-root {

      .stage { margin: 0 6px; }

      }
